<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#280b10">
  <meta name="description" content="One year. Eight memories. One journey.">
  <title>A year to remember · Happy birthday</title>
  <link rel="stylesheet" href="styles.css?v=20260920-2">
  <script src="data/events.js" defer></script>
  <script src="script.js?v=20260920-2" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Happy Birthday</p>
      <h1>A year to remember</h1>
      <p class="intro-note">For Jiang</p>
    </header>
    <section class="journey" aria-label="Interactive memory map">
      <div class="map" id="map">
        <img class="map-art" src="images/map.png" alt="Красно-золотая карта: путь среди гор, от восходящего солнца к вершине." width="1672" height="941" fetchpriority="high">
        <svg class="route" id="route" viewBox="0 0 1672 941" aria-hidden="true">
          <g id="segments"></g>
          <circle id="traveler" class="traveler" r="5" cx="195" cy="565" />
        </svg>
        <div id="points" class="points"></div>
      </div>
      <footer class="journey-footer">
        <span id="counter" class="counter">00 / 08</span>
        <div class="current">
          <p id="status" role="status" aria-live="polite">The journey begins…</p>
          <button id="open-current" class="text-button" type="button" disabled>Open memory <span aria-hidden="true">↗</span></button>
        </div>
        <button id="restart" class="text-button" type="button" hidden>Start again ↺</button>
      </footer>
    </section>
    <p class="dedication">The best is still ahead.</p>
    <noscript><p class="noscript">Enable JavaScript to follow the journey.</p></noscript>
  </main>
  <aside class="soundtrack" aria-label="Birthday soundtrack">
    <span class="soundtrack-label">Soundtrack</span>
    <iframe
      title="Youshi · Golden Descent by Leonard Cai"
      src="https://bandcamp.com/EmbeddedPlayer/album=2894253411/size=small/bgcol=280b10/linkcol=c9a869/track=4210248419/transparent=true/"
      loading="lazy"
      seamless>
      <a href="https://leonardcai.bandcamp.com/track/youshi-golden-descent">Youshi · Golden Descent by Leonard Cai</a>
    </iframe>
  </aside>
  <dialog id="memory" aria-labelledby="memory-title" aria-describedby="memory-text final-message">
    <article class="memory-card story-card">
      <button id="close-memory" class="close" type="button" aria-label="Close and continue the journey">×</button>
      <header class="memory-header">
        <p id="memory-date" class="eyebrow"></p>
        <h2 id="memory-title"></h2>
      </header>
      <div class="memory-visual">
        <p class="envelope-greeting" id="envelope-greeting" hidden></p>
        <div class="envelope-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="letter-paper" id="letter-paper" hidden>
            <p id="letter-words" aria-live="polite"></p>
            <button id="letter-next" class="text-button" type="button">Continue reading →</button>
          </div>
        <div id="slides" class="slides" aria-label="Chapter media"></div>
        <div id="placeholder" class="placeholder"><span class="placeholder-star" aria-hidden="true">✧</span><span>Your memory will appear here</span></div>
      </div>
      <nav id="photo-controls" class="photo-controls" aria-label="Media controls" hidden>
        <button id="photo-prev" type="button" aria-label="Previous item">←</button>
        <span id="photo-count" aria-live="off"></span>
        <button id="photo-next" type="button" aria-label="Next item">→</button>
        <button id="photo-pause" type="button" aria-label="Pause slideshow">Pause</button>
      </nav>
      <div class="memory-copy">
        <p id="memory-text"></p>
        <section id="final-message" class="letter-scene" hidden aria-label="A letter for Jiang">
          <button id="envelope-open" class="text-button" type="button">Read your letter →</button>

        </section>
        <nav class="memory-actions" aria-label="Story navigation">
          <button id="previous" class="text-button" type="button">← Back</button>
          <button id="continue" class="gold-button" type="button">Continue the journey →</button>
        </nav>
      </div>
    </article>
  </dialog>
</body>
</html>
